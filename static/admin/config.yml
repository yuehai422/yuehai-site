# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: yuehai422/yuehai-site
  branch: main

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    filter:
      field: slug
      pattern: ".+"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Slug, name: slug, widget: string }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: 显示目录, name: showToc, widget: boolean, default: false }
      - { label: 目录默认展开, name: TocOpen, widget: boolean, default: false }
      - { label: 隐藏摘要, name: hideSummary, widget: boolean, default: true }
      - { label: 隐藏元信息, name: hideMeta, widget: boolean, default: true }
      - { label: 搜索中隐藏, name: searchHidden, widget: boolean, default: true }
      - { label: 隐藏分享按钮, name: disableShare, widget: boolean, default: false }
      - label: 封面图
        name: cover
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 图片（可留空）, name: image, widget: image, required: false }
          - { label: 图片说明, name: alt, widget: string, required: false }
          - { label: 本篇隐藏封面, name: hidden, widget: boolean, default: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }
