{{ define "main" }}
<header class="page-header list-header">
  <p class="hero-eyebrow">Index</p>
  <h1>{{ .Title }}</h1>
</header>
<ul class="post-list">
  {{ range .Pages }}
  <li>
    <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
  </li>
  {{ else }}
  <li class="empty">还没有文章。</li>
  {{ end }}
</ul>
{{ end }}
