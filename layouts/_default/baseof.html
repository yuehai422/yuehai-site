<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}" />
</head>
<body class="{{ if .IsHome }}is-home{{ end }}">
  <header class="site-header">
    {{ if not .IsHome }}
    <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    {{ else }}
    <span class="brand-spacer" aria-hidden="true"></span>
    {{ end }}
    <nav>
      <a href="{{ "/posts/" | relURL }}">笔记</a>
      <a href="{{ "/admin/" | relURL }}">编辑</a>
    </nav>
  </header>
  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>{{ .Site.Params.description }}</p>
  </footer>
</body>
</html>
