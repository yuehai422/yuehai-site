{{ define "main" }}
<article class="post">
  <header class="page-header">
    <p class="back"><a href="{{ "/posts/" | relURL }}">← 笔记</a></p>
    <h1>{{ .Title }}</h1>
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.tags }}
      ·
      {{ range . }}<span class="tag">{{ . }}</span> {{ end }}
      {{ end }}
    </p>
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
