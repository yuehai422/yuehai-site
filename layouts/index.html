{{ define "main" }}
<section class="hero">
  <p class="hero-eyebrow">个人技术笔记</p>
  <h1 class="brand-hero">{{ .Site.Title }}</h1>
  <p class="lede">{{ .Site.Params.description }}</p>
</section>
<section class="post-index" aria-labelledby="recent-notes">
  <div class="section-head">
    <h2 id="recent-notes">最近笔记</h2>
    <a class="section-more" href="{{ "/posts/" | relURL }}">全部</a>
  </div>
  <ul class="post-list">
    {{ range first 20 (where .Site.RegularPages "Section" "posts") }}
    <li>
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    </li>
    {{ else }}
    <li class="empty">还没有文章。</li>
    {{ end }}
  </ul>
</section>
{{ end }}
