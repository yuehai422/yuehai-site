# Phase A: Cloudflare Pages preview first; custom domain later.
baseURL: "https://yuehai.space/"
locale: zh-CN
timeZone: Asia/Shanghai
title: yuehai
enableRobotsTXT: true

params:
  description: "写给自己的技术笔记与备忘。"

markup:
  goldmark:
    renderer:
      unsafe: true

permalinks:
  posts: /posts/:slug/

disableKinds:
  - taxonomy
  - term

outputs:
  home: [HTML]
  section: [HTML]
  page: [HTML]
