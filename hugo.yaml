# yuehai.space — Hugo + PaperMod + Sveltia CMS
baseURL: "https://yuehai.space/"
title: yuehai
languageCode: zh-cn
defaultContentLanguage: zh
locale: zh-CN
timeZone: Asia/Shanghai
theme: PaperMod
enableRobotsTXT: true

pagination:
  pagerSize: 8

permalinks:
  posts: /posts/:slug/
  photography: /photography/:slug/

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
  page:
    - HTML

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  env: production
  description: "写给自己的技术笔记与备忘。"
  author: yuehai
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false
  mainSections:
    - posts

  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  UseHugoToc: true
  # 目录仅由文章 CMS 的 showToc / TocOpen 控制
  showtoc: false
  tocopen: false
  comments: false
  hideSummary: true
  hideMeta: false

  label:
    text: yuehai

  # 门户首页：无文章列表，仅简介 + 栏目入口
  profileMode:
    enabled: true
    title: yuehai
    subtitle: "写给自己的技术笔记与备忘。"
    buttons:
      - name: 笔记
        url: /posts/
      - name: 摄影
        url: /photography/

  socialIcons:
    - name: github
      url: "https://github.com/yuehai422"

menu:
  main:
    - identifier: posts
      name: 笔记
      url: /posts/
      weight: 10
    - identifier: photography
      name: 摄影
      url: /photography/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: admin
      name: 编辑
      url: /admin/
      weight: 40
